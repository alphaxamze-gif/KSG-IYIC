<footer class="bg-dark text-white">
  <div class="container-custom grid gap-10 py-12 md:grid-cols-3">
    <div>
      <p class="text-lg font-semibold">KSG-<span class="text-primary">IYIC</span> Hub</p>
      <p class="mt-3 text-sm leading-6 text-gray-300">
        Youth skills and innovation programmes at Desert Trail Building, Isiolo.
      </p>
    </div>

    <nav aria-label="Footer">
      <p class="text-sm font-semibold uppercase tracking-wide text-primary-light">Explore</p>
      <ul class="mt-3 space-y-2">
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" class="text-sm text-gray-300 hover:text-white">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div>
      <p class="text-sm font-semibold uppercase tracking-wide text-primary-light">Partners</p>
      <ul class="mt-3 space-y-2">
        @for (partner of partners; track partner) {
          <li class="text-sm text-gray-300">{{ partner }}</li>
        }
      </ul>
    </div>
  </div>

  <div class="border-t border-white/10">
    <p class="container-custom py-4 text-sm text-gray-400">© {{ year }} KSG-IYIC Hub</p>
  </div>
</footer>
