<header class="sticky top-0 z-50 border-b border-gray-200 bg-white">
  <div class="container-custom flex h-16 items-center justify-between gap-4">
    <a routerLink="/" class="text-lg font-semibold tracking-tight text-dark" (click)="closeMenu()">
      KSG-<span class="text-primary">IYIC</span>
    </a>

    <nav class="hidden items-center gap-6 lg:flex" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="!text-primary"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="text-sm font-medium text-dark-light hover:text-primary"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/become-a-volunteer" class="btn-primary px-4 py-2 text-sm">Volunteer</a>
    </nav>

    <button
      type="button"
      class="inline-flex items-center justify-center rounded-md p-2 text-dark lg:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        @if (menuOpen()) {
          <path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path stroke-linecap="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-nav" class="border-t border-gray-200 bg-white lg:hidden" aria-label="Mobile">
      <div class="container-custom flex flex-col gap-1 py-3">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-primary-light/40 !text-primary-dark"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            class="rounded-md px-3 py-2 text-sm font-medium text-dark"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <a
          routerLink="/become-a-volunteer"
          class="btn-primary mt-2 text-sm"
          (click)="closeMenu()"
        >
          Volunteer
        </a>
      </div>
    </nav>
  }
</header>
